</head><body><header><button class="btn iconbtn" id="menu" aria-label="Ouvrir le catalogue">☰</button><h1>Nekhen <small>Cartographie des vulnérabilités · visites de site</small></h1><button class="btn desktop" id="export">Exporter</button><button class="btn desktop" id="import">Importer</button><button class="btn primary" id="rename">Entreprise</button></header>
<div class="canvas" id="canvas"><div class="world" id="world"><svg id="edges"></svg><div class="node center" data-center="1" id="center"><div class="tiny">Site analysé</div><strong id="companyName"></strong><div class="sub">Nœud central</div></div><div id="nodes"></div></div></div>

<script>
(()=>{'use strict';const $=id=>document.getElementById(id),KEY='nekhen-site-cartography-v1';const categories={'Périmètre & accès':['Clôture insuffisante','Accès non contrôlé','Portail vulnérable','Zone de livraison exposée','Entrée secondaire non sécurisée'],'Bâtiment & sûreté':['Porte insuffisamment protégée','Vitrage vulnérable','Angles morts de vidéosurveillance','Éclairage extérieur insuffisant','Détection intrusion inadaptée'],'Organisation & procédures':['Contrôle des visiteurs insuffisant','Gestion des clés inadaptée','Gestion des badges insuffisante','Consignes d’urgence incomplètes','Procédures de fermeture insuffisantes'],'Personnel & environnement':['Sensibilisation du personnel insuffisante','Vulnérabilité liée aux prestataires','Circulation interne non maîtrisée','Stockage sensible exposé','Exposition des personnes ou valeurs']};let state={company:'Entreprise / site',nodes:[]},view={x:innerWidth/2-110,y:Math.max(130,innerHeight/2-140),s:1},selected=null,drag=null;try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.nodes))state={company:String(d.company||'Entreprise / site'),nodes:d.nodes.slice(0,250)}}catch(e){}const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Stockage local indisponible : exportez votre cartographie.')}};const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);function toggle(b){$('sidebar').classList.toggle('open',b);$('shade').classList.toggle('on',b)}$('menu').onclick=()=>toggle(!$('sidebar').classList.contains('open'));$('shade').onclick=()=>toggle(false);function add(title,x,y){if(state.nodes.length>=250)return alert('Limite de 250 cartes');const n={id:uid(),title,x:x??330+(state.nodes.length%3)*30,y:y??(state.nodes.length*118)-160,observation:'',severity:'none',status:'observed'};state.nodes.push(n);saveLocal();render();toggle(false);edit(n.id)}function catalog(){for(const [cat,items] of Object.entries(categories)){const h=document.createElement('div');h.className='category';h.textContent=cat;$('catalog').append(h);for(const name of items){const b=document.createElement('button');b.className='item';b.innerHTML='<span></span><small>Toucher ou glisser sur la carte</small>';b.querySelector('span').textContent=name;b.addEventListener('click',()=>{if(!b.dataset.dragged)add(name)});b.addEventListener('pointerdown',e=>{b.dataset.dragged='';b._start={x:e.clientX,y:e.clientY};});b.addEventListener('pointermove',e=>{if(b._start&&Math.hypot(e.clientX-b._start.x,e.clientY-b._start.y)>20)b.dataset.dragged='1'});b.addEventListener('pointerup',e=>{if(b.dataset.dragged==='1'){const rect=$('canvas').getBoundingClientRect();if(e.clientX>rect.left+35&&e.clientY>rect.top){const p=screenToWorld(e.clientX,e.clientY);add(name,p.x-95,p.y-35)}setTimeout(()=>{b.dataset.dragged=''},0)}b._start=null});$('catalog').append(b)}}}function screenToWorld(x,y){const r=$('canvas').getBoundingClientRect();return{x:(x-r.left-view.x)/view.s,y:(y-r.top-view.y)/view.s}}function transform(){$('world').style.transform=`translate(${view.x}px,${view.y}px) scale(${view.s})`}function edges(){const s=$('edges');s.replaceChildren();for(const n of state.nodes){const path=document.createElementNS('http://www.w3.org/2000/svg','path');const x=124,y=40,tx=n.x+105,ty=n.y+40,mid=(x+tx)/2;path.setAttribute('d',`M ${x} ${y} C ${mid} ${y},${mid} ${ty},${tx} ${ty}`);path.setAttribute('fill','none');path.setAttribute('stroke','#aeb9c8');path.setAttribute('stroke-width','2');s.append(path)}}}function render(){transform();$('companyName').textContent=state.company;const wrap=$('nodes');wrap.replaceChildren();for(const n of state.nodes){const el=document.createElement('div');el.className='node';el.style.left=n.x+'px';el.style.top=n.y+'px';el.dataset.id=n.id;const meta=document.createElement('div');meta.className='tiny';meta.textContent='Vulnérabilité';const strong=document.createElement('strong');strong.textContent=n.title;const sub=document.createElement('div');sub.className='sub';const dot=document.createElement('i');dot.className='dot '+n.severity;sub.append(dot,document.createTextNode((n.observation||'Toucher pour observer').slice(0,65)));el.append(meta,strong,sub);wrap.append(el)}edges()}function edit(id){selected=id;const n=state.nodes.find(n=>n.id===id);if(!n)return;$('title').value=n.title;$('observation').value=n.observation||'';$('severity').value=n.severity||'none';$('status').value=n.status||'observed';$('panel').classList.add('on')}function close(){$('panel').classList.remove('on');selected=null}$('close').onclick=close;$('save').onclick=()=>{const n=state.nodes.find(n=>n.id===selected);if(!n)return;n.title=$('title').value.trim()||'Vulnérabilité';n.observation=$('observation').value;n.severity=$('severity').value;n.status=$('status').value;saveLocal();render();close()};$('remove').onclick=()=>{if(!selected||!confirm('Supprimer cette vulnérabilité ?'))return;state.nodes=state.nodes.filter(n=>n.id!==selected);saveLocal();render();close()};$('rename').onclick=()=>{const s=prompt('Nom de l’entreprise ou du site',state.company);if(s?.trim()){state.company=s.trim().slice(0,120);saveLocal();render()}};function exportJSON(){const a=document.createElement('a'),blob=new Blob([JSON.stringify({...state,version:1,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='Nekhen_Cartographie_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2500)}$('export').onclick=$('export2').onclick=exportJSON;$('import').onclick=$('import2').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.nodes))throw Error('Format invalide');if(!confirm('Remplacer la carte actuelle par le fichier importé ?'))return;state={company:String(d.company||'Entreprise / site'),nodes:d.nodes.slice(0,250).filter(n=>n&&typeof n.title==='string').map(n=>({id:uid(),title:n.title.slice(0,120),x:Math.max(-5000,Math.min(5000,Number(n.x)||0)),y:Math.max(-5000,Math.min(5000,Number(n.y)||0)),observation:String(n.observation||''),severity:['none','low','medium','high'].includes(n.severity)?n.severity:'none',status:['observed','review','resolved'].includes(n.status)?n.status:'observed'}))};saveLocal();render();toggle(false)}catch(err){alert('Fichier JSON invalide')}e.target.value=''};const canvas=$('canvas');canvas.addEventListener('pointerdown',e=>{if(e.target.closest('.node')){const el=e.target.closest('.node'),id=el.dataset.id;drag={type:id?'node':'center',id,x:e.clientX,y:e.clientY,startX:id?state.nodes.find(n=>n.id===id).x:0,startY:id?state.nodes.find(n=>n.id===id).y:0,moved:false}}else drag={type:'pan',x:e.clientX,y:e.clientY,startX:view.x,startY:view.y,moved:false};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>6)drag.moved=true;if(drag.type==='pan'){view.x=drag.startX+dx;view.y=drag.startY+dy;transform()}else if(drag.type==='node'){const n=state.nodes.find(n=>n.id===drag.id);if(n){n.x=drag.startX+dx/view.s;n.y=drag.startY+dy/view.s;render()}}});canvas.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;if(d.type==='node'){saveLocal();if(!d.moved)edit(d.id)}else if(d.type==='center'&&!d.moved)$('rename').click()});canvas.addEventListener('pointercancel',()=>{drag=null;saveLocal()});let touches=new Map(),pinch=null;canvas.addEventListener('touchstart',e=>{for(const t of e.changedTouches)touches.set(t.identifier,{x:t.clientX,y:t.clientY});if(touches.size===2){const a=[...touches.values()];pinch={distance:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),scale:view.s};drag=null}},{passive:true});canvas.addEventListener('touchmove',e=>{for(const t of e.changedTouches)touches.set(t.identifier,{x:t.clientX,y:t.clientY});if(pinch&&touches.size===2){const a=[...touches.values()];view.s=Math.max(.35,Math.min(2.5,pinch.scale*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/pinch.distance));transform()}},{passive:true});canvas.addEventListener('touchend',e=>{for(const t of e.changedTouches)touches.delete(t.identifier);if(touches.size<2)pinch=null},{passive:true});function zoom(v){view.s=Math.max(.35,Math.min(2.5,view.s*v));transform()}$('zoomin').onclick=()=>zoom(1.2);$('zoomout').onclick=()=>zoom(1/1.2);$('reset').onclick=()=>{view={x:innerWidth/2-110,y:Math.max(130,innerHeight/2-140),s:1};transform()};catalog();render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});})();
</script></body></html>
